# 三个 job：Linux 跑 fmt / clippy / 全 workspace 测试（排除 IMK 外壳）与 Fcitx5 插件检查；macOS 与 Windows runner 各编各的壳并跑平台测试，
# 平台特有的编译错（Objective-C 调用、TSF 导出、WinUI）在 PR 里就暴露，不等发版。仓库公开，Actions 不计费。
# actions 一律钉到 commit（注释里是对应的标签），Dependabot 每周提 PR 更新；cargo 全加 --locked，Cargo.lock 没提交就报错。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    # Linux 壳首个支持目标；ubuntu-latest 仍可能提供较旧的 Fcitx5 开发包。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build and test dependencies
        run: |
          sudo apt-get update
          # gnome-origin 在私有总线加载真实 dbus/dbusfrontend；开发库不包含这些模块。
          sudo apt-get install -y cmake g++ dbus-daemon fcitx5-modules libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev nlohmann-json3-dev libxcb1-dev libxcb-render0-dev libxcb-randr0-dev libwayland-dev wayland-protocols xvfb

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude qingjian-macos --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude qingjian-macos --locked

      - name: Build and test Fcitx5 addon
        run: |
          cmake -S apps/linux/fcitx5 -B target/fcitx5 -DCMAKE_BUILD_TYPE=Debug -DQINGJIAN_X11_BACKEND=OFF
          cmake --build target/fcitx5 --parallel 2
          ctest --test-dir target/fcitx5 --output-on-failure

      - name: Build render-ffi and optional addon path
        run: |
          cargo build -p qingjian-render-ffi --release --locked
          cmake -S apps/linux/fcitx5 -B target/fcitx5-ffi -DCMAKE_BUILD_TYPE=Debug -DQINGJIAN_RENDER_FFI=ON -DQINGJIAN_RENDER_FFI_LIB=$PWD/target/release/libqingjian_render_ffi.a -DQINGJIAN_RENDER_FFI_INCLUDE=$PWD/apps/linux/render-ffi/include -DQINGJIAN_X11_BACKEND=ON
          cmake --build target/fcitx5-ffi --parallel 2
          ctest --test-dir target/fcitx5-ffi --output-on-failure

      - name: Build standalone Wayland capability probe
        run: |
          cmake -S apps/linux/probes/wayland -B target/wayland-probe
          cmake --build target/wayland-probe --parallel 2

      - name: Test GNOME protocol and Linux management
        run: |
          node apps/linux/gnome/test.mjs
          node apps/linux/probes/gnome/test.mjs
          python3 apps/linux/tests/management.py
          bash apps/linux/tests/uninstall.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (IMK shell)
        run: cargo clippy -p qingjian-macos --all-targets --locked -- -D warnings

      - name: Test (IMK shell)
        run: cargo test -p qingjian-macos --locked

  windows:
    runs-on: windows-latest
    env:
      # Server 的 build.rs 嵌 uiAccess manifest，没签名的 exe（含测试二进制）起不来（os error 740）；与 release.yml 一样关掉
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (Server, TSF DLL, Settings)
        run: cargo clippy -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --all-targets --locked -- -D warnings

      - name: Test (Server, TSF DLL, Settings)
        run: cargo test -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --locked

      # 安装包另带一份 32 位 DLL（企业微信 / WPS 这类 32 位应用只能加载它）
      - name: Check (TSF DLL, 32-bit)
        run: cargo check -p qingjian-windows-tsf --target i686-pc-windows-msvc --locked
